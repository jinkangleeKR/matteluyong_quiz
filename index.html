<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="현장 퀴즈에 참여하는 공식 접속 페이지입니다."
    />
    <title>현장 퀴즈 | 참가 페이지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="glow glow-one" aria-hidden="true"></div>
      <div class="glow glow-two" aria-hidden="true"></div>

      <section class="quiz-card" aria-labelledby="page-title">
        <p class="eyebrow"><span></span> LIVE QUIZ</p>
        <div class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <path d="M32 7 38.7 21l15.3 2.2-11.1 10.8 2.6 15.2L32 42l-13.5 7.2L21.1 34 10 23.2 25.3 21 32 7Z" />
          </svg>
        </div>
        <h1 id="page-title">퀴즈에 참가할 준비가 되었나요?</h1>
        <p class="intro">
          진행자가 퀴즈를 시작하면 이곳에서 바로 문제를 풀 수 있어요.
        </p>

        <div class="status-panel" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <div>
            <p class="status-label">현재 상태</p>
            <p id="quiz-status" class="status-text">퀴즈 시작을 기다리고 있어요</p>
          </div>
        </div>

        <button id="enter-quiz" class="enter-button" type="button" disabled>
          퀴즈 입장하기
          <span aria-hidden="true">→</span>
        </button>
        <p id="guide-message" class="guide-message">
          잠시만 기다려 주세요. 시작되면 버튼이 활성화됩니다.
        </p>
      </section>

      <p class="footer-note">이 페이지를 닫지 말고 잠시 기다려 주세요.</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
